<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="View the latest announcements and updates for SC Tool Hub.">
  <title>New Updates · SC Tool Hub</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/config.js"></script>
</head>
<body data-page="updates">
<main id="content">

  <h2 style="margin-top: 0;">New Updates</h2>

  <!-- Admin post form (hidden for non-admins) -->
  <div id="adminPostSection" hidden class="card" style="margin-bottom: 20px;">
    <h3 style="margin-top: 0;">📢 Post an update (admin)</h3>
    <form id="postForm">
      <label for="updateTitle">Title</label>
      <input id="updateTitle" placeholder="Announcement title" required>

      <label for="updateBody">Details</label>
      <textarea id="updateBody" rows="4" required placeholder="Write your announcement here..."></textarea>

      <div style="margin-top: 14px;">
        <button class="btn">📤 Publish</button>
      </div>
    </form>
  </div>

  <!-- Updates list -->
  <div id="updatesList"></div>

</main>

<script src="assets/js/app.js"></script>
<script>
(async () => {
  const S = await initShell();
  if (!S) return;

  API.log("page_view", "Updates page");

  async function loadUpdates() {
    try {
      const result = await API.listUpdates();
      const updates = result.updates || [];

      $("#updatesList").innerHTML = updates.length
        ? updates.map(u => `
            <article class="card upd">
              <h3 style="margin: 0 0 6px;">${esc(u.Title)}</h3>
              <small>${fmtDate(u.CreatedDate)}</small>
              <p style="margin-top: 8px; color: var(--tx-secondary); line-height: 1.6;">${esc(u.Body)}</p>
            </article>
          `).join("")
        : '<div class="empty">📭 No announcements yet.</div>';
    } catch (err) {
      $("#updatesList").innerHTML = '<div class="empty">❌ Failed to load updates.</div>';
    }
  }

  loadUpdates();

  // Admin: show post form
  if (S.isAdmin) {
    $("#adminPostSection").hidden = false;

    $("#postForm").onsubmit = async e => {
      e.preventDefault();

      try {
        await API.createUpdate(
          $("#updateTitle").value.trim(),
          $("#updateBody").value.trim()
        );

        API.log("admin_action", "Published update: " + $("#updateTitle").value.trim());
        e.target.reset();
        loadUpdates();
        showToast("Update published!", "success");
      } catch (err) {
        showToast("Failed to publish update", "error");
      }
    };
  }
})();
</script>

</body>
</html>
