<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Submit and track support tickets for the SC Tool Hub.">
  <title>Raise a Ticket · SC Tool Hub</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/config.js"></script>
</head>
<body data-page="ticket">
<main id="content">

  <h2 style="margin-top: 0;">Raise a Ticket</h2>

  <div class="card">
    <form id="ticketForm">
      <div class="row">
        <div>
          <label for="category">Category</label>
          <select id="category">
            <option>Macro file issue</option>
            <option>Automation bot request</option>
            <option>Access / permissions</option>
            <option>Data issue</option>
            <option>New feature</option>
            <option>Other</option>
          </select>
        </div>
        <div>
          <label for="priority">Priority</label>
          <select id="priority">
            <option>Low</option>
            <option selected>Medium</option>
            <option>High</option>
            <option>Critical</option>
          </select>
        </div>
      </div>

      <label for="subject">Subject</label>
      <input id="subject" required maxlength="120" placeholder="Brief description of the issue">

      <label for="description">Description</label>
      <textarea id="description" rows="5" required placeholder="What happened? Which file or tool? Steps to reproduce."></textarea>

      <div class="row">
        <div>
          <label for="relatedItem">Related file / tool (optional)</label>
          <input id="relatedItem" placeholder="e.g. Macro_v2.xlsm">
        </div>
        <div>
          <label for="phone">Contact phone (optional)</label>
          <input id="phone" type="tel" placeholder="+91 XXXXX XXXXX">
        </div>
      </div>

      <div style="margin-top: 20px;">
        <button class="btn" id="submitTicketBtn">🎫 Submit ticket</button>
      </div>
      <div class="msg" id="ticketMsg"></div>
    </form>
  </div>

  <h3 style="margin-top: 28px;">My Tickets</h3>

  <div class="card">
    <div class="tw">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Subject</th>
            <th>Category</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Raised</th>
          </tr>
        </thead>
        <tbody id="ticketTable"></tbody>
      </table>
    </div>
    <div class="empty" id="ticketEmpty">No tickets yet.</div>
  </div>

</main>

<script src="assets/js/app.js"></script>
<script>
(async () => {
  const S = await initShell();
  if (!S) return;

  API.log("page_view", "Tickets page");

  async function loadTickets() {
    try {
      const result = await API.listTickets();
      const tickets = result.tickets || [];
      $("#ticketTable").innerHTML = tickets.map(t => `
        <tr>
          <td>#${esc(t.TicketNo || t.Id)}</td>
          <td>${esc(t.Title || t.Subject)}</td>
          <td>${esc(t.Category)}</td>
          <td>${esc(t.Priority)}</td>
          <td><span class="pill ${esc(t.Status).replace(/ /g, '-')}">${esc(t.Status)}</span></td>
          <td>${fmtDate(t.CreatedDate)}</td>
        </tr>
      `).join("");
      $("#ticketEmpty").style.display = tickets.length ? "none" : "block";
    } catch (err) {
      showToast("Failed to load tickets", "error");
    }
  }

  loadTickets();

  $("#ticketForm").onsubmit = async e => {
    e.preventDefault();
    const btn = $("#submitTicketBtn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px;"></span> Submitting…';

    try {
      const result = await API.createTicket({
        category:    $("#category").value,
        priority:    $("#priority").value,
        subject:     $("#subject").value.trim(),
        description: $("#description").value.trim(),
        relatedItem: $("#relatedItem").value.trim() || null,
        phone:       $("#phone").value.trim() || null,
        requesterName:  S.name,
        requesterEmail: S.user.email
      });

      if (result.error) throw new Error(result.error);

      const m = $("#ticketMsg");
      m.className = "msg ok";
      m.textContent = "Ticket #" + (result.ticketNo || "—") + " submitted. Track it below.";

      API.log("ticket_create", "Ticket #" + (result.ticketNo || ""));
      e.target.reset();
      loadTickets();
      showToast("Ticket submitted successfully!", "success");
    } catch (err) {
      const m = $("#ticketMsg");
      m.className = "msg err";
      m.textContent = err.message;
      showToast("Failed to submit ticket", "error");
    }

    btn.disabled = false;
    btn.textContent = "🎫 Submit ticket";
  };
})();
</script>

</body>
</html>
