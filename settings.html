<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Manage your account profile, credentials, and appearance preferences in SC Tool Hub.">
  <title>Settings · SC Tool Hub</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/config.js"></script>
</head>
<body data-page="settings">
<main id="content">

  <div style="margin-bottom: 24px;">
    <h2 style="margin: 0 0 6px;">Account Settings</h2>
    <p style="color: var(--mu); font-size: 14px; margin: 0;">Manage your profile information, password credentials, and portal theme preferences.</p>
  </div>

  <div class="row">
    <!-- Profile Card -->
    <div class="card">
      <h3 style="margin-top: 0; margin-bottom: 16px; font-size: 18px;">👤 Profile Information</h3>
      <form id="profileForm">
        <label for="fullNameInput">Full Name</label>
        <input id="fullNameInput" required placeholder="Enter your full name">

        <label for="deptInput">Department / Team</label>
        <input id="deptInput" placeholder="e.g. Supply Chain / Procurement">

        <label for="emailDisplay">Enterprise Email</label>
        <input id="emailDisplay" disabled style="opacity: 0.7; cursor: not-allowed;">

        <div style="margin-top: 20px;">
          <button class="btn" id="saveProfileBtn">💾 Save Profile</button>
        </div>
        <div class="msg" id="profileMsg"></div>
      </form>
    </div>

    <!-- Password & Appearance -->
    <div class="card">
      <h3 style="margin-top: 0; margin-bottom: 16px; font-size: 18px;">🔒 Security Credentials</h3>
      <form id="passwordForm">
        <label for="newPw">New Password</label>
        <input id="newPw" type="password" minlength="8" required autocomplete="new-password" placeholder="Min. 8 characters">

        <label for="confirmPw">Confirm New Password</label>
        <input id="confirmPw" type="password" required autocomplete="new-password" placeholder="Re-enter new password">

        <div style="margin-top: 20px;">
          <button class="btn alt" id="updatePwBtn">🔄 Change Password</button>
        </div>
        <div class="msg" id="pwMsg"></div>
      </form>

      <div style="margin-top: 32px; padding-top: 24px; border-top: 1px dashed var(--bd);">
        <h3 style="margin: 0 0 12px; font-size: 18px;">🎨 Portal Theme</h3>
        <label for="themeSelect" style="margin-top: 0;">Color Mode</label>
        <select id="themeSelect">
          <option value="light">☀️ Light Theme (Default)</option>
          <option value="dark">🌙 Dark Theme (Midnight Slate)</option>
        </select>
      </div>
    </div>
  </div>

</main>

<script src="assets/js/app.js"></script>
<script>
(async () => {
  const S = await initShell();
  if (!S) return;

  API.log("page_view", "Settings page");

  const say = (sel, text, isError) => {
    const m = $(sel);
    m.textContent = text;
    m.className = "msg " + (isError ? "err" : "ok");
  };

  $("#fullNameInput").value = S.profile?.full_name || S.name || "";
  $("#deptInput").value = S.profile?.department || "";
  $("#emailDisplay").value = S.user.email;
  $("#themeSelect").value = localStorage.getItem("theme") || "light";

  $("#themeSelect").onchange = e => {
    const theme = e.target.value;
    applyTheme(theme);
    API.log("settings_change", `Theme changed to ${theme}`);
    showToast(`Switched to ${theme} theme`, "success");
  };

  $("#profileForm").onsubmit = async e => {
    e.preventDefault();
    const btn = $("#saveProfileBtn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;"></span> Saving…';

    const fullName = $("#fullNameInput").value.trim();
    const department = $("#deptInput").value.trim();

    try {
      const result = await API.updateProfile(fullName, department);
      if (result.error) throw new Error(result.error);

      const session = Session.get();
      if (session) {
        session.fullName = fullName;
        session.department = department;
        Session.save(session);
      }

      say("#profileMsg", "Profile details saved successfully.", false);
      API.log("settings_change", "Profile updated");
      showToast("Profile saved!", "success");
    } catch (err) {
      say("#profileMsg", err.message || "Failed to update profile.", true);
      showToast("Failed to save profile", "error");
    }

    btn.disabled = false;
    btn.textContent = "💾 Save Profile";
  };

  $("#passwordForm").onsubmit = async e => {
    e.preventDefault();
    const newPw = $("#newPw").value;
    const confirmPw = $("#confirmPw").value;

    if (newPw !== confirmPw) {
      return say("#pwMsg", "Passwords do not match.", true);
    }

    const btn = $("#updatePwBtn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;"></span> Updating…';

    try {
      const result = await API.changePassword(newPw);
      if (result.error) throw new Error(result.error);

      say("#pwMsg", "Password updated successfully.", false);
      API.log("settings_change", "Password updated");
      e.target.reset();
      showToast("Password updated!", "success");
    } catch (err) {
      say("#pwMsg", err.message || "Failed to update password.", true);
      showToast("Failed to update password", "error");
    }

    btn.disabled = false;
    btn.textContent = "🔄 Change Password";
  };
})();
</script>

</body>
</html>
